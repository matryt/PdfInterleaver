name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*' # Se déclenche quand tu pousses un tag comme v1.0.0, v1.0.1, etc.
  workflow_dispatch: # Garde la possibilité de tester manuellement

permissions:
  contents: write # Indispensable pour autoriser le script à créer la Release

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compiler le JAR avec Maven
        run: mvn clean package

      - name: Préparer le dossier d'entrée jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "input-jar"
          Copy-Item "target/pdf-interleaver.jar" -Destination "input-jar/"

      - name: Générer l'application portable native
        shell: pwsh
        run: |
          jpackage `
            --type app-image `
            --input input-jar `
            --name "PdfInterleaver" `
            --main-jar pdf-interleaver.jar `
            --main-class PdfInterleaverApp `
            --dest dist

      - name: Compacter le dossier en ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PdfInterleaver" -DestinationPath "dist/PdfInterleaver-Windows.zip"

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/PdfInterleaver-Windows.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false