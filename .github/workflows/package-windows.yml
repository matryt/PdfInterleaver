name: Build Windows MSI

on:
  workflow_dispatch: # Permet aussi de déclencher manuellement le build depuis l'interface GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration du JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Installation de WiX Toolset
        run: choco install wixtoolset -y

      - name: Compiler le JAR avec Maven
        run: mvn clean package

      - name: Préparer le dossier d'entrée jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "input-jar"
          Copy-Item "target/pdf-interleaver.jar" -Destination "input-jar/"

      - name: Générer l'installeur MSI avec jpackage
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          jpackage `
            --type msi `
            --input input-jar `
            --name "PdfInterleaver" `
            --main-jar pdf-interleaver.jar `
            --main-class PdfInterleaverApp `
            --app-version 1.0.0 `
            --dest dist `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      - name: Uploader l'installeur (.msi)
        uses: actions/upload-artifact@v4
        with:
          name: PdfInterleaver-Installer-Windows
          path: dist/*.msi